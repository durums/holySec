server {
    listen 80;
    server_name ops.holysec.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ops.holysec.de;

    # ssl_certificate     /etc/letsencrypt/live/ops.holysec.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ops.holysec.de/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self';" always;

    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

